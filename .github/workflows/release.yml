name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Leave empty when running on a release tag."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-release:
    name: Build Windows Installer & Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag and version
        id: meta
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and -not $env:REQUESTED_TAG) {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($env:REQUESTED_TAG) {
            $tag = $env:REQUESTED_TAG
          } else {
            throw "Select a release tag or supply the new version tag when publishing from a branch."
          }
          $version = $tag.TrimStart('v')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved release tag=$tag, version=$version"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $found = $false
          foreach ($p in @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )) {
            if (Test-Path $p) { $found = $true; break }
          }
          if (-not $found -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup -y --no-progress
          }

      - name: Build release binary, portable zip, and Inno Setup installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\scripts\build-installer.ps1 -DownloadCore -Version "${{ steps.meta.outputs.version }}"

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $files = @(
            "dist\MihomoDesktop-Setup-$version-x64.exe",
            "dist\MihomoDesktop-$version-x64-portable.zip"
          )
          $lines = foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Expected artifact not found: $f" }
            $h = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $(Split-Path -Leaf $f)"
          }
          $lines | Set-Content -Encoding ASCII "dist\SHA256SUMS.txt"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Mihomo Desktop ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/MihomoDesktop-Setup-${{ steps.meta.outputs.version }}-x64.exe
            dist/MihomoDesktop-${{ steps.meta.outputs.version }}-x64-portable.zip
            dist/SHA256SUMS.txt
