[package]
name = "mihomo-desktop"
version = "0.1.2"
edition = "2024"
description = "A modern GPUI desktop client for Mihomo (Clash Meta) Windows Service"
license = "MIT"
repository = "https://github.com/arloor/mihomo-desktop"

[dependencies]
semver = "1"
sha2 = "0.10"
tempfile = "3"
gpui-kit = "0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "system-proxy"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
dirs = "6"
urlencoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-service = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[build-dependencies]
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
